<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Monogram mark, simplified to a single letter at favicon size.
       Light theme by default; dark theme via prefers-color-scheme. -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#1c1c1e" stroke-width="4"/>
  <text x="32" y="45" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="600" fill="#1c1c1e" text-anchor="middle">J</text>
  <style>
    @media (prefers-color-scheme: dark) {
      rect { stroke: #f5f5f4; }
      text { fill: #f5f5f4; }
    }
  </style>
</svg>