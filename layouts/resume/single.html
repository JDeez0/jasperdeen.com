{{ define "main" }}
<article class="page">
  <h1>{{ .Title }}</h1>

  {{/* PDF.js inline viewer — renders resume.pdf onto a canvas, page by page,
       with a paginator and a no-JS download fallback. */}}
  <script src="/js/pdf-js/build/pdf.js"></script>

  <div class="embed-pdf-container" id="embed-pdf-container">
    <div class="pdf-loadingWrapper" id="pdf-loadingWrapper">
      <div class="pdf-loading" id="pdf-loading"></div>
    </div>
    <div id="overlayText">
      <a href="/resume.pdf" aria-label="Download" download>
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18">
          <path d="M9 13c.3.0.5-.1.7-.3L15.4 7 14 5.6l-4 4V1H8v8.6l-4-4L2.6 7l5.7 5.7c.2.2.4.3.7.3zm-7 2h14v2H2z"/>
        </svg>
      </a>
    </div>
    <canvas class="pdf-canvas" id="pdf-canvas"></canvas>
  </div>
  <div class="pdf-paginator" id="pdf-paginator">
    <button id="pdf-prev" type="button">‹ Prev</button>
    <span id="pdf-page-info"></span>
    <button id="pdf-next" type="button">Next ›</button>
  </div>
  <noscript>View the PDF file <a href="/resume.pdf">here</a>.</noscript>

  <script type="text/javascript">
  // Wait for pdf.js to finish loading before initializing. The external
  // <script src=pdf.js> above is non-deferred, so this inline script can
  // run before it has parsed — window["pdfjs-dist/build/pdf"] would be
  // undefined and silently break everything. Defer init to window.load.
  window.addEventListener('load', function () {
    var pdfjsLib = window["pdfjs-dist/build/pdf"];
    if (!pdfjsLib) return;
    pdfjsLib.GlobalWorkerOptions.workerSrc = "/js/pdf-js/build/pdf.worker.js";

    var c = "/resume.pdf",
        n = null, e = 1, i = false, o = null, b = 3,
        t = document.getElementById("pdf-canvas"),
        m = t.getContext("2d"),
        f = document.getElementById("pdf-paginator"),
        r = document.getElementById("pdf-loadingWrapper");

    function renderPage(page){
      i = true;
      n.getPage(page).then(function(page){
        var viewport = page.getViewport({scale: b});
        t.height = viewport.height;
        t.width = viewport.width;
        page.render({canvasContext: m, viewport: viewport}).promise.then(function(){
          i = false;
          showCanvas();
          updatePaginator();
          if (o !== null) { renderPage(o); o = null; }
        });
      });
    }
    function showCanvas(){ r.style.display="none"; t.style.display="block"; }
    function showLoader(){ r.style.display="flex"; t.style.display="none"; }
    function showPaginator(){ f.style.display="flex"; }
    function updatePaginator(){
      document.getElementById("pdf-page-info").textContent = e + " / " + n.numPages;
      document.getElementById("pdf-prev").disabled = (e <= 1);
      document.getElementById("pdf-next").disabled = (e >= n.numPages);
    }
    function go(page){ if(i){o=page;} else {e=page; showLoader(); renderPage(e);} }

    showLoader();
    showPaginator();
    document.getElementById("pdf-prev").addEventListener("click", function(){ if(e>1){ go(e-1); } });
    document.getElementById("pdf-next").addEventListener("click", function(){ if(!n||e>=n.numPages) return; go(e+1); });

    pdfjsLib.getDocument(c).promise.then(function(pdf){
      n = pdf;
      if (e > n.numPages) e = n.numPages;
      renderPage(e);
    });
  });
  </script>
</article>
{{ end }}
