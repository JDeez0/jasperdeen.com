<!doctype html>
<html lang="{{ .Site.LanguageCode }}" dir="ltr">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "nav.html" . }}
  <main class="shell">
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">
    <div class="shell">
      {{ .Site.Params.author.name }} — <a href="mailto:{{ .Site.Params.author.email }}">{{ .Site.Params.author.email }}</a>
    </div>
  </footer>
</body>
</html>
