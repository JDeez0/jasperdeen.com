<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="{{ or .Description .Site.Params.description | plainify | htmlUnescape }}">
<meta name="theme-color" content="#f3f6f1">

<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="{{ .Site.Title }}">
<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ or .Description .Site.Params.description | plainify | htmlUnescape }}">
<meta property="og:locale" content="{{ .Site.LanguageCode }}">
<meta property="og:type" content="website">

<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
<link rel="icon" href="/images/fav/favicon.ico">
<link rel="apple-touch-icon" href="/images/fav/apple-touch-icon.png">
<link rel="manifest" href="/images/fav/site.webmanifest">
<link rel="canonical" href="{{ .Permalink }}">

{{- $css := resources.Get "css/garden.css" | resources.Minify | resources.Fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">

{{- with .OutputFormats.Get "rss" }}
<link rel="alternate" type="{{ .MediaType.Type }}" href="{{ .Permalink }}" title="{{ $.Site.Title }}">
{{- end }}
