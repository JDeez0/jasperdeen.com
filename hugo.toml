baseURL = "https://jasperdeen.com/"
languageCode = "en-us"
title = "Jasper H. Deen"
theme = "book"

enableGitInfo = true
paginate = 10
disablePathToLower = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[params]
  # Color theme: matches ritarka.github.io, which is light-only
  BookTheme = "light"

  # Render every top-level section/page in the sidebar filetree
  BookSection = "/"

  # Date format used on posts
  BookDateFormat = "January 2, 2006"

  # Enable client-side search (fuse.js)
  BookSearch = true

  # Disable comments (no Disqus configured)
  BookComments = false

  # Repo used for "last modified" + edit links
  BookRepo = "https://github.com/JDeez0/jasperdeen.com"

[params.author]
  name = "Jasper H. Deen"
  email = "jasperdeen@gmail.com"

# The sidebar shows only the BookSection filetree: About, Writing, Resume, Contact.
# (Home stays reachable via the site title/brand link at the top of the sidebar.)

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
