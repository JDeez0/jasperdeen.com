baseURL = "https://jasperdeen.com/"
languageCode = "en-us"
title = "Jasper H. Deen"
theme = "book"

enableGitInfo = true
paginate = 10
disablePathToLower = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[params]
  # Color theme: light, dark or auto (auto follows OS/browser preference)
  BookTheme = "auto"

  # Render every top-level section/page in the sidebar filetree
  BookSection = "/"

  # Date format used on posts
  BookDateFormat = "January 2, 2006"

  # Enable client-side search (fuse.js)
  BookSearch = true

  # Disable comments (no Disqus configured)
  BookComments = false

  # Repo used for "last modified" + edit links
  BookRepo = "https://github.com/JDeez0/jasperdeen.com"

[params.author]
  name = "Jasper H. Deen"
  email = "jasperdeen@gmail.com"

# Sidebar links shown ABOVE the filetree
[[menu.before]]
  name = "Home"
  pageRef = "/"
  weight = 1

# Sidebar links shown BELOW the filetree (external contact links)
[[menu.after]]
  name = "Mail"
  url = "mailto:jasperdeen@gmail.com"
  weight = 10

[[menu.after]]
  name = "GitHub"
  url = "https://github.com/JDeez0"
  weight = 20

[[menu.after]]
  name = "LinkedIn"
  url = "https://www.linkedin.com/"
  weight = 30

[[menu.after]]
  name = "X"
  url = "https://x.com/"
  weight = 40

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
